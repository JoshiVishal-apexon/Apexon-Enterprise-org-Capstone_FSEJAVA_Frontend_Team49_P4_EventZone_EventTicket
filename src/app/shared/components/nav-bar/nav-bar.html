<nav class="nav-bar">
  <div class="nav-bar__brand">
    <a routerLink="/" aria-label="EventZone home">
      <span class="nav-bar__logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" focusable="false">
          <path class="nav-bar__logo-ticket" d="M8 11.5A3.5 3.5 0 0 1 11.5 8h17A3.5 3.5 0 0 1 32 11.5v3a3.5 3.5 0 0 0 0 7v3a3.5 3.5 0 0 1-3.5 3.5h-17A3.5 3.5 0 0 1 8 24.5v-3a3.5 3.5 0 0 0 0-7v-3Z"></path>
          <path class="nav-bar__logo-star" d="m20 11.5 1.65 3.34 3.69.54-2.67 2.6.63 3.67L20 19.92l-3.3 1.73.63-3.67-2.67-2.6 3.69-.54L20 11.5Z"></path>
          <path class="nav-bar__logo-divider" d="M11.5 24.5h17"></path>
        </svg>
      </span>
      <span>EventZone</span>
    </a>
  </div>

  <div class="nav-bar__links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>

    @if (currentUser()) {
      <a routerLink="/my-bookings" routerLinkActive="active">My Bookings</a>

      @if (currentUser()?.role === 'ORGANISER') {
        <a routerLink="/organiser" routerLinkActive="active">Organiser Dashboard</a>
      }

      @if (currentUser()?.role === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">Admin Panel</a>
      }

      <div class="nav-bar__profile">
        <button
          type="button"
          class="nav-bar__profile-button"
          aria-label="Open profile menu"
          [attr.aria-expanded]="profileOpen"
          aria-controls="profile-menu"
          (click)="toggleProfile()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8" r="3.25"></circle>
            <path d="M5.5 20c.6-3.3 2.8-5 6.5-5s5.9 1.7 6.5 5"></path>
          </svg>
        </button>

        <div
          id="profile-menu"
          class="nav-bar__profile-menu"
          [class.is-open]="profileOpen"
          role="menu"
        >
          <span class="nav-bar__user" role="menuitem">
            {{ currentUser()?.name }} ({{ currentUser()?.role }})
          </span>
          <button type="button" class="nav-bar__logout" role="menuitem" (click)="logout()">Logout</button>
        </div>
      </div>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </div>
</nav>
